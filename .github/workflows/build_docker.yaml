name: Build & Push docker

on:
  workflow_call:
    inputs:
      image_name:
        description: Image name without registry name & without tag
        required: true
        type: string
      tag:
        required: false
        default: "latest"
        type: string
      registry_name:
        required: true
        type: string
      dockerfile:
        required: false
        default: "./Dockerfile"
        type: string
    secrets:
      gh_pat:
        required: false
      registry_username:
        required: true
      registry_password:
        required: true

jobs:
  build:
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Registry Log In
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.registry_name }}
          username: ${{ secrets.registry_username }}
          password: ${{ secrets.registry_password }}

      - name: Build and push container image
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: |
            ${{ inputs.registry_name }}/${{ inputs.image_name }}:${{ github.sha }}
            ${{ inputs.registry_name }}/${{ inputs.image_name }}:${{ inputs.tag }}
          file: ${{ inputs.dockerfile }}
          # GHA layer cache. Removed in #4 because the old buildx
          # (setup-buildx-action@v2 / build-push-action@v4) hit
          # "invalid token without access controls" after GitHub retired the
          # legacy (v1) cache service. The v3/v6 bump above speaks the new cache
          # API, so the cache works again.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          secrets: |
            gh_pat=${{ secrets.gh_pat }}
