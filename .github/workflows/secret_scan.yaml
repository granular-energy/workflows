name: "Secret scan"

# Scans the commits of a PR for secrets with gitleaks and fails on any finding.
# Call it from a `pull_request` workflow in the caller repo. The caller repo owns the gitleaks
# config (default `.gitleaks.toml` at its root); without that file, gitleaks uses its default rules.
on:
  workflow_call:
    inputs:
      config-path:
        description: "Path of the gitleaks config in the caller repo"
        required: false
        type: string
        default: ".gitleaks.toml"

permissions:
  contents: read

defaults:
  run:
    # Without an explicit shell, GitHub runs `bash -e` with no pipefail.
    shell: bash

env:
  GITLEAKS_VERSION: 8.30.1
  # From gitleaks_8.30.1_checksums.txt of the release; checked again against that file below.
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: secret-scan-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Check the event
        if: github.event_name != 'pull_request'
        run: |
          echo "::error::Secret scan needs a pull_request event, got $GITHUB_EVENT_NAME"
          exit 1

      # No persisted credentials: the scan needs only local git.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      # The release binary, not gitleaks/gitleaks-action: the action needs a paid licence key for
      # organisation accounts. The tarball must match both the pinned hash and the release checksums.
      - name: Install gitleaks
        run: |
          cd "$RUNNER_TEMP"
          base="https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS_VERSION"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$tarball" "$base/$tarball"
          curl -sSfL -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          echo "$GITLEAKS_SHA256  $tarball" | sha256sum -c -
          grep -qxF "$GITLEAKS_SHA256  $tarball" checksums.txt
          tar -xzf "$tarball" gitleaks
          ./gitleaks version

      - name: Scan the PR commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CONFIG_PATH: ${{ inputs.config-path }}
        run: |
          config_args=()
          if [ -f "$CONFIG_PATH" ]; then
            config_args=(--config "$CONFIG_PATH")
            config_note="$CONFIG_PATH"
          else
            config_note="gitleaks default rules ($CONFIG_PATH not found)"
          fi
          status=0
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact "${config_args[@]}" --log-opts="$BASE_SHA..$HEAD_SHA" \
            --report-format json --report-path "$RUNNER_TEMP/findings.json" . || status=$?
          commits="$(git rev-list --count "$BASE_SHA..$HEAD_SHA")"
          {
            if [ "$status" -eq 0 ]; then
              echo "### Secret scan: no secrets found"
              echo
              echo "- Commits scanned: $commits"
              echo "- Config: $config_note"
            elif [ ! -s "$RUNNER_TEMP/findings.json" ]; then
              echo "### Secret scan: gitleaks failed with exit code $status, see the job log"
            else
              echo "### Secret scan: $(jq length "$RUNNER_TEMP/findings.json") possible secrets found"
              echo
              echo "- Commits scanned: $commits"
              echo "- Config: $config_note"
              echo "- Remove the secret from the branch history and rotate it. If it is a test fixture, allowlist it in $CONFIG_PATH."
              echo
              echo "| Rule | File | Line | Commit |"
              echo "| --- | --- | --- | --- |"
              jq -r '.[] | "| \(.RuleID) | \(.File) | \(.StartLine) | \(.Commit[:10]) |"' "$RUNNER_TEMP/findings.json"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
