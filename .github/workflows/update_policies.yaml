name: Update policies

on:
  workflow_call:
    inputs:
      overlay:
        required: false
        type: string
      workspace:
        required: true
        type: string
      deployments-repository:
        required: false
        default: "granular-energy/granular-deployments"
        type: string
      polices_config_file:
        required: true
        type: string
      polices_file:
        required: true
        type: string
      polices_config_name:
        required: true
        type: string
    secrets:
      private_access_token:
        required: true

jobs:
  update-policies:
    runs-on: 'ubuntu-latest'
    # Two runs that write the same policy config file conflict in the rebase in
    # the Commit step. Queue them instead. GitHub cancels a queued run when a
    # newer one joins the group, so the newest queued policy is the one that lands.
    concurrency:
      group: update-policies-${{ inputs.workspace }}-${{ inputs.overlay }}-${{ inputs.polices_config_file }}
      cancel-in-progress: false
    steps:
    - name: Checkout deployments repository
      uses: actions/checkout@v3
      with:
        repository: ${{ inputs.deployments-repository }}
        ref: main
        token: ${{ secrets.private_access_token }}
        path: deployments

    - name: Checkout project repository
      uses: actions/checkout@v3
      with:
        path: project

    - name: Setup git config
      working-directory: ./deployments
      run: |
        git config user.name "GranuBot"
        git config user.email "<>"

    - name: Copy
      run: |
        cat <<EOF > $GITHUB_WORKSPACE/deployments/${{ inputs.workspace }}/overlays/${{ inputs.overlay }}/${{ inputs.polices_config_file }}
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: ${{ inputs.polices_config_name }}
        data:
          policy.rego: |-
        $(sed  's/^/    /' $GITHUB_WORKSPACE/project/${{ inputs.polices_file }})
        EOF

    - name: Commit
      working-directory: ./deployments
      run: |
        git add -A
        git commit -m "Update policy from ${{ github.repository }}:${{ inputs.polices_file }} to ${{ inputs.polices_config_file }}" || true
        # main moves on every deploy, so a plain push loses the race whenever
        # another commit lands between checkout and push. Rebase and retry.
        for attempt in 1 2 3 4 5; do
          if git push origin main; then exit 0; fi
          echo "Push rejected (attempt $attempt of 5); rebasing onto current main"
          sleep $((attempt * 3))
          git fetch origin main
          git rebase origin/main || { git rebase --abort; echo "::error::Rebase conflict while retrying the push"; exit 1; }
        done
        echo "::error::Could not push to main after 5 attempts"
        exit 1
